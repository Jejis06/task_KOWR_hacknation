[project]
name = "woda-backend"
version = "0.1.0"
description = "KOWR HackNation 2026 – backend danych o działce (Zatrzymaj wodę, chroń plony)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.26",
    "diskcache>=5.6",
    "pyyaml>=6.0",
    "rasterio>=1.4.4",
    "scipy>=1.17.1",
    "duckdb>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: test odpytuje prawdziwe zewnętrzne API (uruchom: pytest -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py311"
