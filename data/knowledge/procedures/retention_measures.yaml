meta:
  title: Katalog działań retencyjnych i agrotechnicznych (NWRM)
  snapshot_date: 2026-11-21
  basis: "KE (2014, 2015) Natural Water Retention Measures; IUNG-PIB SiR 71(25) 2023; CDR e-poradnik 2025; zasada „retain water where it falls”"
  order: "ocena → przyczyny → retencja krajobrazowa → retencja glebowa/agrotechnika → nawadnianie (KOWR, Podstawy naukowe)"
  cause_keys: [opady_deficyt, gleba_niska_retencja, odplyw_powierzchniowy, uprawa_wrazliwa]

items:
  - id: miedzyplony
    name: Międzyplony / poplony
    group: agrotechnika
    addresses: [gleba_niska_retencja, odplyw_powierzchniowy]
    when: "Siew po zbiorze plonu głównego (lip–sie), pozostawienie na zimę lub do wiosny"
    effect: "Zwiększa materię organiczną i infiltrację, chroni przed parowaniem i erozją."
    legal: brak
    funding: []
    funding_note: "ekoschematy WPR (np. „Rolnictwo węglowe” – międzyplony) – szczegóły w aktualnym naborze ARiMR"
    status: OK

  - id: resztki_mulcz
    name: Pozostawianie resztek pożniwnych / mulcz
    group: agrotechnika
    addresses: [gleba_niska_retencja]
    effect: "Ogranicza parowanie z powierzchni gleby, poprawia strukturę."
    legal: brak
    status: OK

  - id: uprawa_uproszczona
    name: Uprawa uproszczona / bezorkowa
    group: agrotechnika
    addresses: [gleba_niska_retencja, odplyw_powierzchniowy]
    effect: "Mniej przesychania wierzchniej warstwy, lepsza struktura i retencja."
    legal: brak
    status: OK

  - id: materia_organiczna
    name: Zwiększanie materii organicznej (obornik, kompost)
    group: agrotechnika
    addresses: [gleba_niska_retencja]
    effect: "Wzrost próchnicy zwiększa pojemność wodną gleby (por. „4 per mille”, Minasny i in. 2017)."
    legal: "Program działań azotanowych – terminy i dawki"
    status: OK

  - id: uprawa_w_poprzek_stoku
    name: Uprawa w poprzek stoku
    group: agrotechnika
    addresses: [odplyw_powierzchniowy]
    applies_if: "slope_mean_deg > 3"
    effect: "Spowalnia spływ powierzchniowy, ogranicza erozję."
    legal: brak
    status: OK

  - id: zastawka_row
    name: Zastawka / piętrzenie na rowie melioracyjnym
    group: retencja_krajobrazowa
    addresses: [odplyw_powierzchniowy, opady_deficyt]
    applies_if: "w pobliżu rów (hydrology.nearest_water kind=ditch, < 200 m)"
    effect: "Woda zostaje dłużej w okolicy i zasila wody gruntowe – efekt niemal natychmiastowy."
    legal: "Zatrzymanie wody w istniejącym rowie – bez zgłoszenia; przy rowie przez kilka działek – zgoda sąsiadów/spółka wodna; nowe urządzenie – zgłoszenie/pozwolenie."
    legal_ids: [row_zatrzymanie, row_przebudowa]
    status: OK

  - id: oczko_zbiornik
    name: Oczko wodne / mały zbiornik retencyjny w zagłębieniu
    group: retencja_krajobrazowa
    addresses: [odplyw_powierzchniowy, opady_deficyt]
    applies_if: "terrain.depressions_geojson niepuste lub position in [valley, depression]; poza strefą powodziową"
    effect: "Magazyn wody opadowej; objętość ≈ zlewnia × opad × współczynnik odpływu − parowanie z lustra (widełki)."
    legal: "≤5000 m², ≤3 m, zasilanie opadowe/gruntowe – zgłoszenie wodnoprawne; większy lub z cieku – pozwolenie."
    legal_ids: [staw_zgloszenie, staw_pozwolenie, oczko_male, ograniczenia_lokalizacji]
    funding: [arimr_i104]
    status: OK

  - id: pas_buforowy
    name: Pas buforowy / zadrzewienie śródpolne
    group: retencja_krajobrazowa
    addresses: [odplyw_powierzchniowy]
    effect: "Spowalnia odpływ, ogranicza erozję i parowanie (efekt wiatrochronny)."
    legal: "DKR 4 – strefy buforowe przy ciekach"
    status: OK

  - id: mokradlo
    name: Ochrona / odtworzenie mokradła, podniesienie poziomu wody na TUZ
    group: retencja_krajobrazowa
    addresses: [opady_deficyt]
    applies_if: "TUZ, gleby organiczne, dolina"
    effect: "Duża retencja krajobrazowa, płatności ekoschematu."
    funding: [ekoschemat_tuz, interwencja_8_torfowiska]
    status: OK

  - id: nawadnianie_kroplowe
    name: Nawadnianie (kropelkowe / deszczownia) – ostatni krok
    group: nawadnianie
    addresses: [uprawa_wrazliwa, opady_deficyt]
    effect: "Pokrywa deficyt w okresach krytycznych; dawka z bilansu FAO-56 (ETc − opad efektywny)."
    legal: "Nawadnianie = szczególne korzystanie z wód → pozwolenie wodnoprawne; ≤5 m³/d średniorocznie ze studni ≤30 m na potrzeby własne – zwykłe korzystanie (DO_WERYFIKACJI dla nawadniania upraw towarowych)."
    legal_ids: [nawadnianie_pozwolenie, zwykle_korzystanie, studnia_do_30m, studnia_glebinowa]
    status: OK
