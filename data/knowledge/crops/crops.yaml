meta:
  title: Uprawy – okres wegetacji, terminy, potrzeby wodne (17 upraw)
  snapshot_date: 2026-11-21
  sources:
    - "FAO-56 (Allen i in.), Tab. 11 (długości faz), Tab. 12 (Kc), Tab. 22 (głębokość korzeni Zr, frakcja p)"
    - "SMSR IUNG-PIB – grupy upraw monitorowane (Doroszewski i in. 2012); S2MUR rozszerza do 25 pozycji"
    - "Terminy siewu/zbioru: typowe dla Polski (COBORU, IUNG, CDR) – [SZACUNEK], różnice regionalne ±2 tyg."
  fields:
    sowing: "okno siewu MM-DD..MM-DD"
    harvest: "okno zbioru"
    stages: "fazy FAO-56 [ini, dev, mid, late] w dniach liczone od `stages_start` (dla ozimych: ruszenie wegetacji wiosną)"
    kc: "Kc ini / mid / end (FAO-56, klimat umiarkowany)"
    root_depth_m: "Zr max [m]"
    p: "dopuszczalne wyczerpanie wody dostępnej (bez stresu)"
    critical: "okresy krytyczne niedoboru wody"
    smsr_cwb_thresholds_mm: "progi KBW suszy SMSR per kategoria gleby 1–4 – DO UZUPEŁNIENIA z Doroszewski i in. 2012"
  smsr_groups: [zboża ozime, zboża jare, kukurydza na ziarno, kukurydza na kiszonkę, rzepak i rzepik, ziemniak, burak cukrowy,
                rośliny strączkowe, truskawki, drzewa owocowe, krzewy owocowe, warzywa gruntowe, chmiel, tytoń]
  smsr_groups_source: "data/knowledge/raw/smsr_progi_www.txt (tabela progów KBW wg rozp. MRiRW z 11.04.2019)"
  growing_season_pl: "Okres wegetacji w Polsce: średnio od końca marca/kwietnia (t > 5 °C) do października/listopada; 200–230 dni (zach.), 180–200 dni (płn.-wsch.) [SZACUNEK]"
  status_default: SZACUNEK

