winter_rules:
  - "Siew jesienny (IX–X): tylko uprawy ozime (pszenica, żyto, pszenżyto, jęczmień ozimy, rzepak do początku IX)."
  - "XI–II: brak siewów polowych; czas na planowanie retencji (zastawki, oczka, zgłoszenia wodnoprawne przed sezonem)."
  - "Uprawy ciepłolubne (kukurydza, soja) – siew dopiero przy glebie ≥8–10 °C, zwykle od 20 IV; okres wegetacji 120–160 dni wyklucza siew późnym latem."
